<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">André Quispe — Linux, Cloud and DevOps</title>
  <desc id="desc">Animated futuristic banner for a Software Engineering student at UTP, building toward DevSecOps.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070d1c"/><stop offset=".55" stop-color="#101d32"/><stop offset="1" stop-color="#0d2939"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4de2d5"/><stop offset=".55" stop-color="#49baff"/><stop offset="1" stop-color="#9d7bff"/></linearGradient>
    <radialGradient id="cyanGlow"><stop stop-color="#17c9d4" stop-opacity=".19"/><stop offset="1" stop-color="#17c9d4" stop-opacity="0"/></radialGradient>
    <radialGradient id="violetGlow"><stop stop-color="#8562df" stop-opacity=".2"/><stop offset="1" stop-color="#8562df" stop-opacity="0"/></radialGradient>
    <linearGradient id="scan"><stop stop-color="#67e8f9" stop-opacity="0"/><stop offset=".5" stop-color="#67e8f9" stop-opacity=".1"/><stop offset="1" stop-color="#67e8f9" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#77b8d8" stroke-opacity=".085"/></pattern>
    <clipPath id="bannerClip"><rect x="1" y="1" width="1198" height="298" rx="18"/></clipPath>
    <clipPath id="typingClip"><rect class="typing" x="0" y="0" width="240" height="29"/></clipPath>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <style>
    .grid { animation: gridFlow 16s linear infinite; }
    .ambient { animation: ambientDrift 12s ease-in-out infinite alternate; }
    .violet { animation: violetDrift 14s ease-in-out infinite alternate; }
    .sweep { animation: sweep 12s linear infinite; }
    .packet { stroke-dasharray: 9 160; animation: packetFlow 8s linear infinite; }
    .packet.reverse { animation-direction: reverse; animation-duration: 11s; }
    .node { animation: pulse 4s ease-in-out infinite; }
    .delayed { animation-delay: -2s; }
    .cursor { animation: cursorBlink 1.6s steps(1,end) infinite; }
    .typing { animation: typing 10s steps(9,end) infinite; }
    .float { animation: float 6s ease-in-out infinite; }
    .edge { animation: pulse 6s ease-in-out infinite; }
    @keyframes gridFlow { to { transform: translate(40px,40px); } }
    @keyframes ambientDrift { to { transform: translate(110px,-35px); opacity:.65; } }
    @keyframes violetDrift { to { transform: translate(-90px,35px); opacity:.55; } }
    @keyframes sweep { from { transform: translateX(-250px); } to { transform: translateX(1450px); } }
    @keyframes packetFlow { to { stroke-dashoffset:-338; } }
    @keyframes pulse { 0%,100% { opacity:.45; } 50% { opacity:1; } }
    @keyframes cursorBlink { 0%,55% { opacity:1; } 56%,100% { opacity:.1; } }
    @keyframes typing { 0%,8% { width:0; } 28%,100% { width:240px; } }
    @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) { .grid,.ambient,.violet,.sweep,.packet,.node,.cursor,.typing,.float,.edge { animation:none; } .sweep { opacity:0; } }
  </style>
  <g clip-path="url(#bannerClip)">
    <rect width="1200" height="300" fill="url(#background)"/>
    <ellipse class="ambient" cx="820" cy="250" rx="390" ry="250" fill="url(#cyanGlow)"/>
    <ellipse class="violet" cx="1050" cy="25" rx="270" ry="200" fill="url(#violetGlow)"/>
    <rect class="grid" x="-80" y="-80" width="1320" height="420" fill="url(#grid)"/>
    <rect class="sweep" x="0" y="0" width="200" height="300" fill="url(#scan)"/>
    <g fill="none" stroke="#2d536b" stroke-width="1">
      <path d="M440 269H670L718 221H851"/>
      <path d="M705 26H802L841 65H1078L1125 18"/>
      <path d="M946 285H1109L1156 238V134"/>
      <path d="M720 134H787L822 169H880"/>
    </g>
    <g fill="none" stroke="#4de2d5" stroke-width="2" opacity=".65">
      <path class="packet" d="M440 269H670L718 221H851"/>
      <path class="packet reverse" d="M705 26H802L841 65H1078L1125 18"/>
      <path class="packet delayed" d="M946 285H1109L1156 238V134"/>
    </g>
    <g fill="#59d5e3">
      <circle class="node" cx="440" cy="269" r="2.5"/>
      <circle class="node delayed" cx="705" cy="26" r="2.5"/>
      <circle class="node" cx="1156" cy="134" r="2.5"/>
      <circle class="node delayed" cx="785" cy="134" r="2"/>
      <circle class="node" cx="721" cy="221" r="2"/>
    </g>
    <rect class="edge" x="44" y="43" width="5" height="214" rx="2.5" fill="#4de2d5" filter="url(#glow)"/>
    <rect x="44" y="43" width="4" height="214" rx="2" fill="#57e5da"/>
    <g font-family="Segoe UI,Arial,sans-serif">
      <text x="75" y="78" fill="#61e7df" font-size="15" font-weight="700" letter-spacing="3">LEARN · BUILD · AUTOMATE · SECURE</text>
      <text x="73" y="142" fill="#f1f7ff" font-size="49" font-weight="700" letter-spacing="1">ANDRÉ QUISPE</text>
      <text x="75" y="184" fill="#d2e4f3" font-size="25">Linux Systems · Cloud Infrastructure · DevOps</text>
      <text x="75" y="228" fill="#9cbad0" font-size="18">Software Engineering @ UTP · Building toward DevSecOps</text>
    </g>
    <g transform="translate(850 55)">
      <g class="float">
        <rect x="-1" y="-1" width="292" height="192" rx="13" fill="none" stroke="url(#edge)" stroke-opacity=".2" stroke-width="3" filter="url(#glow)"/>
        <rect width="290" height="190" rx="12" fill="#081322" fill-opacity=".94" stroke="url(#edge)" stroke-opacity=".65"/>
        <path d="M1 36H289" stroke="#2b465d"/>
        <circle cx="21" cy="18" r="4" fill="#ffbc66"/><circle cx="37" cy="18" r="4" fill="#59dcd0"/><circle cx="53" cy="18" r="4" fill="#8582e6"/>
        <g font-family="Consolas,monospace" font-size="18">
          <g transform="translate(22 56)" clip-path="url(#typingClip)"><text x="0" y="20" fill="#5bebdf">$ whoami</text></g>
          <text x="22" y="110" fill="#e0edff">Andre1825</text>
          <text x="22" y="147" fill="#9bb9d0">linux / cloud / devops</text>
        </g>
        <rect class="cursor" x="22" y="164" width="9" height="13" rx="1" fill="#5bebdf"/>
      </g>
    </g>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="298.5" rx="18" fill="none" stroke="url(#edge)" stroke-opacity=".22" stroke-width="1.5"/>
</svg>