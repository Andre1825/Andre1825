<style>.shine{animation:shine 10s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}@keyframes shine{from{transform:translateX(-140px)}to{transform:translateX(524px)}}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.shine,.pulse{animation:none}.shine{opacity:0}}</style>
