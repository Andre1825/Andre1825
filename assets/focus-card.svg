<linearGradient id="stroke"><stop stop-color="#8b9cff" stop-opacity=".65"/><stop offset=".55" stop-color="#40617b" stop-opacity=".35"/><stop offset="1" stop-color="#9279dd" stop-opacity=".55"/></linearGradient>
<linearGradient id="shine"><stop stop-color="#8b9cff" stop-opacity="0"/><stop offset=".5" stop-color="#8b9cff" stop-opacity=".08"/><stop offset="1" stop-color="#8b9cff" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect x="1" y="1" width="382" height="94" rx="15"/></clipPath>
